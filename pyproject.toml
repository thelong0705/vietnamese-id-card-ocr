[tool.poetry]
name = "vietnamese-id-card-ocr"
version = "0.1.0"
description = "Vietnamese ID Card OCR system using computer vision and deep learning"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "cropper" },
    { include = "detector" },
    { include = "reader" },
    { include = "util" },
    { include = "config" }
]

[tool.poetry.dependencies]
python = "^3.8.1"
absl-py = "^0.7.1"
astor = "^0.8.0"
autopep8 = "^1.4.4"
certifi = "^2019.3.9"
chardet = "^3.0.4"
cycler = "^0.10.0"
Cython = "^0.29.7"
docutils = "^0.14"
gast = "^0.2.2"
grpcio = "^1.20.1"
h5py = "^2.9.0"
idna = "^2.8"
Keras-Applications = "^1.0.7"
Keras-Preprocessing = "^1.0.9"
Kivy = "^1.10.1"
Kivy-Garden = "^0.1.4"
kiwisolver = "^1.1.0"
Markdown = "^3.1.1"
matplotlib = "^3.1.0"
numpy = "^1.19.0"
opencv-python = "^3.4.1.15"
pgzero = "^1.2"
Pillow = "^8.0.0"
protobuf = "^3.7.1"
pycodestyle = "^2.5.0"
Pygments = "^2.4.0"
pyparsing = "^2.4.0"
pytesseract = "^0.2.6"
python-dateutil = "^2.8.0"
pytz = "^2018.4"
requests = "^2.22.0"
six = "^1.12.0"
tensorboard = "^1.12.2"
tensorflow = "^1.12.0"
termcolor = "^1.1.0"
Unidecode = "^1.0.23"
urllib3 = "^1.25.2"
Werkzeug = "^0.15.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"
pytest-xdist = "^3.3.1"
pytest-timeout = "^2.1.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=cropper",
    "--cov=detector",
    "--cov=reader",
    "--cov=util",
    "--cov=config",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=0",
    "-vv",
    "--tb=short",
    "--maxfail=1"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "skip_ci: Tests to skip in CI environment"
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["cropper", "detector", "reader", "util", "config"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
    "*/.env/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "except ImportError:",
    "pass"
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip_gitignore = true
skip = [".venv", "venv", "env", ".env"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | env
    | \.env
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"